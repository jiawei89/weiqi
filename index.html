<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>网页版围棋</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- 欢迎页面 -->
        <div id="welcome-screen" class="screen active">
            <div class="welcome-container">
                <h1 class="game-title">网页版围棋</h1>
                <div class="game-subtitle">传统智慧，现代体验</div>
                <button id="start-game-btn" class="btn btn-primary">开始游戏</button>
            </div>
        </div>

        <!-- 游戏设置页面 -->
        <div id="setup-screen" class="screen">
            <div class="setup-container">
                <h2 class="screen-title">游戏设置</h2>

                <!-- 游戏模式选择 -->
                <div class="setup-section">
                    <label class="section-label">游戏模式</label>
                    <div class="mode-selector">
                        <button id="pvp-mode" class="mode-btn active" data-mode="pvp">
                            <span class="mode-icon">👥</span>
                            <span class="mode-text">两人对战</span>
                        </button>
                        <button id="pve-mode" class="mode-btn" data-mode="pve">
                            <span class="mode-icon">🤖</span>
                            <span class="mode-text">人机对战</span>
                        </button>
                    </div>
                </div>

                <!-- AI难度选择（仅人机模式显示） -->
                <div id="difficulty-section" class="setup-section" style="display: none;">
                    <label class="section-label">AI难度</label>
                    <div class="difficulty-selector">
                        <button class="difficulty-btn" data-level="easy">初级</button>
                        <button class="difficulty-btn active" data-level="medium">中级</button>
                        <button class="difficulty-btn" data-level="hard">高级</button>
                    </div>
                </div>

                <!-- 胜利条件设置 -->
                <div class="setup-section">
                    <label class="section-label">胜利条件</label>
                    <div class="victory-condition">
                        <div class="preset-scores">
                            <button class="score-btn" data-score="10">10分</button>
                            <button class="score-btn active" data-score="20">20分</button>
                            <button class="score-btn" data-score="50">50分</button>
                        </div>
                        <div class="custom-score">
                            <label for="custom-score-input">自定义：</label>
                            <input type="number" id="custom-score-input" min="1" max="100" placeholder="输入分数">
                            <span>分</span>
                        </div>
                    </div>
                </div>

                <!-- 玩家姓名设置 -->
                <div class="setup-section">
                    <label class="section-label">玩家信息</label>
                    <div class="player-info">
                        <div class="player-input">
                            <label for="black-player">黑方姓名：</label>
                            <input type="text" id="black-player" placeholder="黑方选手" maxlength="20">
                        </div>
                        <div id="white-player-section" class="player-input">
                            <label for="white-player">白方姓名：</label>
                            <input type="text" id="white-player" placeholder="白方选手" maxlength="20">
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="setup-actions">
                    <button id="back-to-welcome" class="btn btn-secondary">返回</button>
                    <button id="start-match" class="btn btn-primary">开始对局</button>
                </div>
            </div>
        </div>

        <!-- 游戏页面 -->
        <div id="game-screen" class="screen">
            <div class="game-container">
                <!-- 游戏头部信息 -->
                <div class="game-header">
                    <div class="player-info-panel">
                        <div class="player-card black-player">
                            <div class="player-name" id="black-name">黑方</div>
                            <div class="player-score">
                                <span class="score-label">得分：</span>
                                <span class="score-value" id="black-score">0</span>
                            </div>
                            <div class="current-player-indicator" id="black-indicator"></div>
                        </div>

                        <div class="vs-separator">VS</div>

                        <div class="player-card white-player">
                            <div class="player-name" id="white-name">白方</div>
                            <div class="player-score">
                                <span class="score-label">得分：</span>
                                <span class="score-value" id="white-score">0</span>
                            </div>
                            <div class="current-player-indicator" id="white-indicator"></div>
                        </div>
                    </div>

                    <div class="game-info">
                        <div class="target-score">目标：<span id="target-score-display">20</span>分</div>
                        <div class="current-turn">当前：<span id="current-turn-display">黑方</span></div>
                        <div class="komi-info" id="komi-info" style="display: none;">白方贴目：6.5目</div>
                    </div>
                </div>

                <!-- 棋盘容器 -->
                <div class="board-container">
                    <canvas id="go-board" width="760" height="760"></canvas>
                    <div class="board-coordinates">
                        <!-- 坐标标签将通过JavaScript生成 -->
                    </div>
                </div>

                <!-- AI思考提示 -->
                <div id="ai-thinking" class="ai-thinking" style="display: none;">
                    <div class="ai-thinking-content">
                        <div class="ai-thinking-icon">🤔</div>
                        <div class="ai-thinking-text">AI正在思考中...</div>
                        <div class="ai-thinking-time">已思考：<span id="thinking-time">0</span>秒</div>
                        <div class="ai-thinking-progress">
                            <div class="progress-bar">
                                <div id="progress-fill" class="progress-fill"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 游戏控制按钮 -->
                <div class="game-controls">
                    <button id="undo-btn" class="btn btn-control" title="悔棋">
                        <span class="btn-icon">↩️</span>
                        <span class="btn-text">悔棋</span>
                    </button>
                    <button id="pass-btn" class="btn btn-control" title="弃子">
                        <span class="btn-icon">⏭️</span>
                        <span class="btn-text">弃子</span>
                    </button>
                    <button id="resign-btn" class="btn btn-control" title="认输">
                        <span class="btn-icon">🏳️</span>
                        <span class="btn-text">认输</span>
                    </button>
                    <button id="pause-btn" class="btn btn-control" title="暂停">
                        <span class="btn-icon">⏸️</span>
                        <span class="btn-text">暂停</span>
                    </button>
                    <button id="menu-btn" class="btn btn-control" title="菜单">
                        <span class="btn-icon">📋</span>
                        <span class="btn-text">菜单</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 排行榜页面 -->
        <div id="leaderboard-screen" class="screen">
            <div class="leaderboard-container">
                <h2 class="screen-title">排行榜</h2>

                <div class="leaderboard-tabs">
                    <button class="tab-btn active" data-tab="total-score">总积分</button>
                    <button class="tab-btn" data-tab="win-rate">胜率</button>
                </div>

                <div class="leaderboard-content">
                    <div id="leaderboard-list" class="leaderboard-list">
                        <!-- 排行榜内容将通过JavaScript生成 -->
                    </div>

                    <div id="empty-leaderboard" class="empty-state" style="display: none;">
                        <div class="empty-icon">🏆</div>
                        <div class="empty-text">暂无排行数据</div>
                        <div class="empty-subtext">开始游戏后即可看到排行榜</div>
                    </div>
                </div>

                <div class="leaderboard-actions">
                    <button id="clear-data-btn" class="btn btn-secondary">清空数据</button>
                    <button id="back-to-menu" class="btn btn-primary">返回主菜单</button>
                </div>
            </div>
        </div>

        <!-- 菜单弹窗 -->
        <div id="menu-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>游戏菜单</h3>
                    <button id="close-menu" class="close-btn">×</button>
                </div>
                <div class="modal-body">
                    <button id="new-game-btn" class="btn btn-menu">新游戏</button>
                    <button id="view-leaderboard-btn" class="btn btn-menu">排行榜</button>
                    <button id="settings-btn" class="btn btn-menu">设置</button>
                    <button id="about-btn" class="btn btn-menu">关于</button>
                </div>
            </div>
        </div>

        <!-- 游戏结束弹窗 -->
        <div id="game-over-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="game-over-title">游戏结束</h3>
                </div>
                <div class="modal-body">
                    <div id="game-over-result" class="game-result"></div>
                    <div id="final-scores" class="final-scores"></div>
                    <div id="score-change" class="score-change"></div>
                </div>
                <div class="modal-footer">
                    <button id="play-again-btn" class="btn btn-primary">再来一局</button>
                    <button id="back-to-main-btn" class="btn btn-secondary">返回主菜单</button>
                </div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>游戏设置</h3>
                    <button id="close-settings" class="close-btn">×</button>
                </div>
                <div class="modal-body">
                    <div class="setting-item">
                        <label class="setting-label">音效</label>
                        <div class="setting-control">
                            <label class="switch">
                                <input type="checkbox" id="sound-toggle" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">振动反馈</label>
                        <div class="setting-control">
                            <label class="switch">
                                <input type="checkbox" id="vibration-toggle" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">显示坐标</label>
                        <div class="setting-control">
                            <label class="switch">
                                <input type="checkbox" id="coordinates-toggle" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label class="setting-label">动画效果</label>
                        <div class="setting-control">
                            <label class="switch">
                                <input type="checkbox" id="animation-toggle" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 关于弹窗 -->
        <div id="about-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>关于网页版围棋</h3>
                    <button id="close-about" class="close-btn">×</button>
                </div>
                <div class="modal-body">
                    <div class="about-content">
                        <div class="app-info">
                            <h4>网页版围棋 v1.0</h4>
                            <p>一款专为平板设备优化的网页版围棋游戏</p>
                        </div>
                        <div class="features">
                            <h4>主要功能：</h4>
                            <ul>
                                <li>支持人机对战和两人对战</li>
                                <li>可自定义胜利条件</li>
                                <li>本地积分排行榜系统</li>
                                <li>响应式设计，适配各种平板</li>
                            </ul>
                        </div>
                        <div class="credits">
                            <h4>开发信息：</h4>
                            <p>开发：David Deng</p>
                            <p>版本：1.0.0</p>
                            <p>更新：2025年11月</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 加载中遮罩 -->
        <div id="loading-overlay" class="loading-overlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">游戏加载中...</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
